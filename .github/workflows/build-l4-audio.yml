name: build-l4-audio

# Build the L4-M5 virtual microphone HAL (32-bit legacy audio module)
# for the redroid guests on G98 and publish it as a GHCR scratch image.
# The build is a cross-compile, so it runs on the x86 runner whose
# image carries the Android NDK (ANDROID_NDK_HOME).

on:
  workflow_dispatch:
  push:
    paths:
      - "l4/audio-hal/**"
      - ".github/workflows/build-l4-audio.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang file binutils
          echo "NDK: $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/33/crtbegin_so.o"

      - name: Build audio HAL
        run: bash l4/audio-hal/build.sh

      - name: Verify ELF (32-bit ARM, bionic deps only)
        run: |
          BIN=l4/audio-hal/out/audio.primary.redroid.so
          readelf -h "$BIN" | grep -E "Class: +ELF32"
          readelf -h "$BIN" | grep -E "Machine: +ARM"
          if readelf -d "$BIN" | grep -E "libstdc\+\+|libc\.so\.6|libgcc_s"; then
            echo "glibc dependency leaked into the binary" >&2
            exit 1
          fi
          readelf -d "$BIN" | grep NEEDED

      - name: Package payload image
        run: |
          mkdir -p l4/audio-hal/payload
          cp l4/audio-hal/out/audio.primary.redroid.so l4/audio-hal/payload/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: <redacted>

      - name: Build and push payload image
        uses: docker/build-push-action@v6
        with:
          context: l4/audio-hal
          file: l4/audio-hal/Dockerfile.artifact
          push: true
          tags: |
            ghcr.io/qfeng3168/redroid-l4-audio:latest
            ghcr.io/qfeng3168/redroid-l4-audio:${{ github.sha }}
