name: probe-runners
on:
  workflow_dispatch:
jobs:
  x86:
    runs-on: ubuntu-24.04
    steps:
      - name: specs
        run: |
          S="arch=$(uname -m) cpu=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G disk=$(df -BG / | awk 'NR==2{print $4}') model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "::notice::SPECS $S"
  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: specs
        run: |
          S="arch=$(uname -m) cpu=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G disk=$(df -BG / | awk 'NR==2{print $4}') model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "::notice::SPECS $S"
