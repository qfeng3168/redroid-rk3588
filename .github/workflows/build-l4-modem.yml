name: build-l4-modem

# Build the L4-M2 virtual AT modem daemon (l4-modemd) for the redroid
# guest on G98, and publish the payload as a GHCR scratch image. The box
# pulls it via the ghcr.1ms.run mirror and bind-mounts the files into the
# redroid container; stock libril/libreference-ril connects to it over
# 127.0.0.1:8901 (rild.libargs=-p 8901).

on:
  workflow_dispatch:
  push:
    paths:
      - "l4/modem/**"
      - "l4/toolchain.tar.gz"
      - ".github/workflows/build-l4-modem.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang file binutils

      - name: Build modem daemon
        run: bash l4/modem/build.sh

      - name: Verify ELF (Android interpreter, no glibc deps)
        run: |
          BIN=l4/modem/out/l4-modemd
          readelf -p .interp "$BIN" | grep -q "/system/bin/linker64"
          if readelf -d "$BIN" | grep -E "libstdc\+\+\.so\.6|libc\.so\.6|libgcc_s"; then
            echo "glibc dependency leaked into the binary" >&2
            exit 1
          fi
          readelf -d "$BIN" | grep NEEDED

      - name: Package payload image
        run: |
          mkdir -p l4/modem/payload
          cp l4/modem/out/l4-modemd l4/modem/payload/
          cp l4/modem/l4-modemd.rc l4/modem/payload/
          cp "l4/modem/android.hardware.radio@1.1.xml" l4/modem/payload/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push payload image
        uses: docker/build-push-action@v6
        with:
          context: l4/modem
          file: l4/modem/Dockerfile.artifact
          push: true
          tags: |
            ghcr.io/qfeng3168/redroid-l4-modem:latest
            ghcr.io/qfeng3168/redroid-l4-modem:${{ github.sha }}
