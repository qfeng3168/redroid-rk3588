<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L4 云手机控制台</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#14161a; color:#e8e8e8; display:flex; height:100vh; }
  #side { width:250px; background:#1c1f24; padding:14px; box-sizing:border-box; overflow-y:auto; flex:none; }
  #side h1 { font-size:16px; margin:0 0 12px; }
  .inst { padding:9px 10px; border-radius:8px; margin-bottom:8px; background:#262a31; cursor:pointer; }
  .inst.sel { outline:2px solid #4da3ff; }
  .inst .nm { font-weight:600; }
  .inst .st { font-size:12px; color:#9aa3ad; margin-top:2px; }
  .inst .acts { margin-top:6px; display:flex; gap:6px; }
  button { background:#333a44; color:#e8e8e8; border:0; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  button:hover { background:#3f4854; }
  button:disabled { opacity:.4; cursor:default; }
  #main { flex:1; display:flex; flex-direction:column; align-items:center; padding:14px; box-sizing:border-box; min-width:0; }
  #bar { display:flex; gap:8px; margin-bottom:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #bar input { background:#262a31; border:1px solid #3a4048; color:#e8e8e8; border-radius:6px; padding:5px 8px; width:220px; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; width:100%; min-height:0; }
  video { max-width:100%; max-height:100%; background:#000; border-radius:8px; touch-action:none; }
  #msg { font-size:12px; color:#9aa3ad; min-height:16px; margin-top:8px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px; }
  .run { background:#39c26d; } .stop { background:#666; }
  fieldset.mod { border:1px solid #2b3038; border-radius:8px; margin:10px 0; padding:10px 12px; }
  fieldset.mod legend { font-weight:600; padding:0 6px; }
  fieldset.mod .grid { display:grid; gap:6px; align-items:center; font-size:13px; margin:8px 0; }
  fieldset.mod input, fieldset.mod select { background:#262a31; color:#e8e8e8; border:1px solid #3a4048; border-radius:6px; padding:4px 6px; }
  fieldset.mod .apply { background:#2b5ea7; }
  fieldset.mod .note { font-size:12px; color:#9aa3ad; }
</style>
</head>
<body>
<div id="side">
  <h1>云手机实例</h1>
  <div id="list"></div>
  <button id="refresh">刷新列表</button>
</div>
<div id="main">
  <div id="bar">
    <button data-key="4">返回</button>
    <button data-key="3">Home</button>
    <button data-key="187">多任务</button>
    <button data-key="26">电源</button>
    <button data-key="24">音量+</button>
    <button data-key="25">音量−</button>
    <input id="txt" placeholder="输入文字后回车发送">
  </div>
  <div id="stage"><video id="v" autoplay muted playsinline></video></div>
  <div id="msg">从左侧选择一个实例开始投屏</div>
  <div id="sensorPanel" style="display:none; margin-top:10px; background:#1c1f24; border-radius:8px; padding:12px 14px; width:100%; max-width:760px; box-sizing:border-box;">
    <div style="font-weight:600; margin-bottom:4px;">设备配置 <span id="cfgInst" style="color:#9aa3ad; font-weight:400;"></span>
      <button id="cfgLoad" style="float:right;">读取全部</button></div>
    <div id="cfgMsg" style="font-size:12px; color:#9aa3ad; margin-bottom:6px;"></div>

    <fieldset class="mod"><legend>传感器</legend>
      <label>模式 <select id="sMode"><option value="sine">动态（正弦摆动）</option><option value="static">静态（固定值）</option></select></label>
      <button data-preset="flat">平放预设</button>
      <div class="grid" style="grid-template-columns:auto repeat(3,1fr);">
        <span>加速度 m/s²</span><input id="saX" type="number" step="0.1"><input id="saY" type="number" step="0.1"><input id="saZ" type="number" step="0.1">
        <span>陀螺 rad/s</span><input id="sgX" type="number" step="0.05"><input id="sgY" type="number" step="0.05"><input id="sgZ" type="number" step="0.05">
      </div>
      <button class="apply" data-mod="sensors">应用</button> <span class="note">逐帧读取，即时生效</span>
    </fieldset>

    <fieldset class="mod"><legend>GPS 定位</legend>
      <label>模式 <select id="gMode"><option value="drift">漂移</option><option value="static">静态</option></select></label>
      <button data-preset="shanghai">上海</button><button data-preset="beijing">北京</button>
      <div class="grid" style="grid-template-columns:auto 1fr auto 1fr;">
        <span>纬度</span><input id="gLat" type="number" step="0.000001">
        <span>经度</span><input id="gLon" type="number" step="0.000001">
        <span>海拔 m</span><input id="gAlt" type="number" step="1">
        <span>精度 m</span><input id="gAcc" type="number" step="0.5">
      </div>
      <button class="apply" data-mod="gnss">应用</button> <span class="note">定位上报时读取</span>
    </fieldset>

    <fieldset class="mod"><legend>摄像头</legend>
      <label>图案 <select id="cPattern"><option value="bars">彩条</option><option value="solid">纯色</option><option value="gradient">渐变</option></select></label>
      <label>帧率 <input id="cFps" type="number" min="1" max="60" style="width:64px;"></label>
      <div class="grid" style="grid-template-columns:auto 1fr;">
        <span>流源 URL</span><input id="cSource" type="text" placeholder="留空=合成图案；可填 .m3u8 / rtsp:// 地址">
      </div>
      <button class="apply" data-mod="camera">应用</button> <span class="note">下次打开相机生效；流源断开自动回退合成图案</span>
    </fieldset>

    <fieldset class="mod"><legend>麦克风</legend>
      <label>模式 <select id="mMode"><option value="sine">正弦波</option><option value="silence">静音</option><option value="wav">WAV 文件</option></select></label>
      <label>频率 Hz <input id="mFreq" type="number" style="width:80px;"></label>
      <label>增益 <input id="mGain" type="number" step="0.05" min="0" max="1" style="width:64px;"></label>
      <div class="grid" style="grid-template-columns:auto 1fr;">
        <span>WAV 路径</span><input id="mWav" type="text">
      </div>
      <button class="apply" data-mod="mic">应用</button> <span class="note">下次开始录音时生效</span>
    </fieldset>

    <fieldset class="mod"><legend>电话 / 身份</legend>
      <label>当前档案 <select id="tProfile"><option value="sim">实体 SIM</option><option value="esim">eSIM</option></select></label>
      <div class="grid" style="grid-template-columns:auto 1fr auto 1fr;">
        <span>IMEI</span><input id="tImei" type="text">
        <span>IMSI</span><input id="tImsi" type="text">
        <span>ICCID</span><input id="tIccid" type="text">
        <span>号码</span><input id="tMsisdn" type="text">
        <span>运营商</span><input id="tOpLong" type="text">
        <span>简称</span><input id="tOpShort" type="text">
        <span>PLMN</span><input id="tOpNum" type="text">
        <span>信号 0-31</span><input id="tRssi" type="number" min="0" max="31">
      </div>
      <button class="apply" data-mod="modem">应用</button> <span class="note">modem 逐请求读取，即时生效；身份类字段改后部分 App 需重启才刷新</span>
    </fieldset>

    <fieldset class="mod"><legend>eSIM 档案</legend>
      <div class="grid" style="grid-template-columns:auto 1fr auto 1fr;">
        <span>IMSI</span><input id="eImsi" type="text">
        <span>ICCID</span><input id="eIccid" type="text">
        <span>号码</span><input id="eMsisdn" type="text">
        <span>运营商</span><input id="eOpLong" type="text">
        <span>简称</span><input id="eOpShort" type="text">
        <span>PLMN</span><input id="eOpNum" type="text">
      </div>
      <button class="apply" data-mod="esim">应用</button> <span class="note">在上方把当前档案切到 eSIM 后生效；留空的字段回退实体 SIM 的值</span>
    </fieldset>
  </div>
</div>
<script src="jmuxer.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let cur = null, ws = null, muxer = null, devW = 1920, devH = 1080;
const p1 = {x:0, y:0, t:0};

async function loadList() {
  const r = await fetch('api/instances');
  const list = await r.json();
  const el = $('#list');
  el.innerHTML = '';
  for (const it of list) {
    const d = document.createElement('div');
    d.className = 'inst' + (cur === it.name ? ' sel' : '');
    const running = it.state === 'running';
    d.innerHTML = `<div class="nm"><span class="dot ${running ? 'run' : 'stop'}"></span>${it.name}</div>
      <div class="st">${it.state} · adb :${it.adb}${it.managed ? '' : ' · 存量(只读)'}</div>`;
    const acts = document.createElement('div');
    acts.className = 'acts';
    for (const a of ['start', 'stop', 'restart']) {
      const b = document.createElement('button');
      b.textContent = {start:'启动', stop:'停止', restart:'重启'}[a];
      b.disabled = !it.managed;
      b.onclick = async (ev) => {
        ev.stopPropagation();
        b.disabled = true; b.textContent = '执行中…';
        const rr = await fetch(`api/instance/${it.name}/${a}`, {method: 'POST'});
        const j = await rr.json();
        $('#msg').textContent = `${it.name} ${a} rc=${j.rc ?? j.error}`;
        b.disabled = false; b.textContent = {start:'启动', stop:'停止', restart:'重启'}[a];
        loadList();
      };
      acts.appendChild(b);
    }
    d.appendChild(acts);
    d.onclick = () => select(it);
    el.appendChild(d);
  }
}

function newMuxer() {
  if (muxer) { try { muxer.destroy(); } catch(e) {} }
  muxer = new JMuxer({ node: 'v', mode: 'video', flushingTime: 0, debug: false });
}
function select(it) {
  cur = it.name;
  document.querySelectorAll('.inst').forEach(e => e.classList.remove('sel'));
  if (ws) { ws.close(); ws = null; }
  $('#msg').textContent = '连接 ' + it.name + ' …';
  newMuxer();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${it.name}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { $('#msg').textContent = it.name + ' 投屏中（点按/滑动直接操作）'; };
  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      const m = JSON.parse(ev.data);
      if (m.t === 'restart') { newMuxer(); $('#msg').textContent = it.name + ' 流重连…'; }
      if (m.t === 'error') { $('#msg').textContent = it.name + ' 出错：' + m.msg; }
    } else if (muxer) {
      muxer.feed({ video: new Uint8Array(ev.data) });
    }
  };
  ws.onclose = () => { $('#msg').textContent = it.name + ' 已断开'; };
  loadList();
}

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function toDev(e) {
  const r = $('#v').getBoundingClientRect();
  return { x: Math.round((e.clientX - r.left) / r.width * devW),
           y: Math.round((e.clientY - r.top) / r.height * devH) };
}
const v = $('#v');
v.addEventListener('pointerdown', e => { const p = toDev(e); p1.x = p.x; p1.y = p.y; p1.t = Date.now(); });
v.addEventListener('pointerup', e => {
  const p = toDev(e);
  const dx = p.x - p1.x, dy = p.y - p1.y, dt = Date.now() - p1.t;
  if (Math.hypot(dx, dy) < 12) send({t:'tap', x:p.x, y:p.y});
  else send({t:'swipe', x1:p1.x, y1:p1.y, x2:p.x, y2:p.y, ms: Math.max(80, Math.min(dt, 800))});
});
document.querySelectorAll('[data-key]').forEach(b =>
  b.onclick = () => send({t:'key', code: parseInt(b.dataset.key)}));
$('#txt').addEventListener('keydown', e => {
  if (e.key === 'Enter') { send({t:'text', text: e.target.value}); e.target.value = ''; }
});
$('#refresh').onclick = loadList;

// ---- L4 device config panel (sensors/gnss/camera/mic/modem) ----
function parseVec(s, dflt) {
  const p = String(s || '').split(',').map(Number);
  return (p.length === 3 && p.every(isFinite)) ? p : dflt;
}
const F = id => document.getElementById(id);
async function cfgLoad() {
  if (!cur) return;
  const r = await fetch(`api/instance/${cur}/l4`);
  const j = await r.json();
  if (j.error) { F('cfgMsg').textContent = j.error; return; }
  const s = j.sensors || {};
  F('sMode').value = s.mode || 'sine';
  const a = parseVec(s.accel, [0, 0, 9.81]), g = parseVec(s.gyro, [0, 0, 0]);
  F('saX').value = a[0]; F('saY').value = a[1]; F('saZ').value = a[2];
  F('sgX').value = g[0]; F('sgY').value = g[1]; F('sgZ').value = g[2];
  const n = j.gnss || {};
  F('gMode').value = n.mode || 'drift';
  F('gLat').value = n.lat ?? ''; F('gLon').value = n.lon ?? '';
  F('gAlt').value = n.alt ?? ''; F('gAcc').value = n.acc ?? '';
  const c = j.camera || {};
  F('cPattern').value = c.pattern || 'bars';
  F('cFps').value = c.fps ?? 30; F('cSource').value = c.source || '';
  const m = j.mic || {};
  F('mMode').value = m.mode || 'sine';
  F('mFreq').value = m.freq ?? 1000; F('mGain').value = m.gain ?? 0.5;
  F('mWav').value = m.wav || '';
  const t = j.modem || {};
  F('tProfile').value = t.profile || 'sim';
  F('tImei').value = t.imei || ''; F('tImsi').value = t.imsi || '';
  F('tIccid').value = t.iccid || ''; F('tMsisdn').value = t.msisdn || '';
  F('tOpLong').value = t.op_long || ''; F('tOpShort').value = t.op_short || '';
  F('tOpNum').value = t.op_num || ''; F('tRssi').value = t.rssi ?? '';
  const e = j.esim || {};
  F('eImsi').value = e.imsi || ''; F('eIccid').value = e.iccid || '';
  F('eMsisdn').value = e.msisdn || '';
  F('eOpLong').value = e.op_long || ''; F('eOpShort').value = e.op_short || '';
  F('eOpNum').value = e.op_num || '';
  F('cfgMsg').textContent = '已读取全部配置';
}
const COLLECT = {
  sensors: () => ({mode: F('sMode').value,
    accel: [F('saX').value, F('saY').value, F('saZ').value].map(Number),
    gyro: [F('sgX').value, F('sgY').value, F('sgZ').value].map(Number)}),
  gnss: () => ({mode: F('gMode').value, lat: Number(F('gLat').value),
    lon: Number(F('gLon').value), alt: Number(F('gAlt').value),
    acc: Number(F('gAcc').value)}),
  camera: () => ({pattern: F('cPattern').value, fps: Number(F('cFps').value),
    source: F('cSource').value.trim()}),
  mic: () => ({mode: F('mMode').value, freq: Number(F('mFreq').value),
    gain: Number(F('mGain').value), wav: F('mWav').value.trim()}),
  modem: () => ({profile: F('tProfile').value,
    imei: F('tImei').value.trim(), imsi: F('tImsi').value.trim(),
    iccid: F('tIccid').value.trim(), msisdn: F('tMsisdn').value.trim(),
    op_long: F('tOpLong').value.trim(), op_short: F('tOpShort').value.trim(),
    op_num: F('tOpNum').value.trim(), rssi: Number(F('tRssi').value)}),
  esim: () => ({imsi: F('eImsi').value.trim(), iccid: F('eIccid').value.trim(),
    msisdn: F('eMsisdn').value.trim(),
    op_long: F('eOpLong').value.trim(), op_short: F('eOpShort').value.trim(),
    op_num: F('eOpNum').value.trim()}),
};
document.querySelectorAll('.apply').forEach(b => b.onclick = async () => {
  if (!cur) return;
  const mod = b.dataset.mod;
  const r = await fetch(`api/instance/${cur}/l4/${mod}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(COLLECT[mod]())});
  const j = await r.json();
  F('cfgMsg').textContent = j.error ? (mod + ' 应用失败：' + j.error)
    : (mod + ' 已应用：' + JSON.stringify(j));
});
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  if (b.dataset.preset === 'flat') {
    F('sMode').value = 'static';
    F('saX').value = 0; F('saY').value = 0; F('saZ').value = 9.81;
    F('sgX').value = 0; F('sgY').value = 0; F('sgZ').value = 0;
  } else if (b.dataset.preset === 'shanghai') {
    F('gLat').value = 31.230416; F('gLon').value = 121.473701;
  } else if (b.dataset.preset === 'beijing') {
    F('gLat').value = 39.904202; F('gLon').value = 116.407394;
  }
});
F('cfgLoad').onclick = cfgLoad;
const _origSelect = select;
select = function(it) {
  _origSelect(it);
  F('sensorPanel').style.display = 'block';
  F('cfgInst').textContent = '· ' + it.name;
  cfgLoad();
};

loadList();
</script>
</body>
</html>
